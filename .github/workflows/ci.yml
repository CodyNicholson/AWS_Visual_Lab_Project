name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content checks and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - name: Objective-map coverage (job summary)
        run: npm run coverage

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  samples-typescript:
    name: Samples (TypeScript + CDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w samples
      - name: Synthesize sample stacks
        working-directory: samples
        run: npx cdk synth -q

  samples-python:
    name: Samples (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: samples/requirements-dev.txt
      - run: pip install -r samples/requirements-dev.txt
      - working-directory: samples
        run: python -m pytest

  infra:
    name: Infrastructure (CDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w infra
      - working-directory: infra
        run: npx cdk synth -q

  site:
    name: Build site
    needs: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:links
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: site/dist
          retention-days: 7
