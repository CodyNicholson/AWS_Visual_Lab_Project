name: Deploy site

# Builds the site and syncs it to the private S3 bucket behind CloudFront.
# GitHub assumes an IAM role through OIDC: no AWS keys are stored in the repo.
# Setup (once): deploy the AwsDevKb-Site and AwsDevKb-GithubOidc stacks (see README), then set these
# repository variables: AWS_DEPLOY_ROLE_ARN, SITE_BUCKET, DISTRIBUTION_ID, AWS_REGION, SITE_URL.
# Until AWS_DEPLOY_ROLE_ARN is set, this workflow skips.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:content
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: npm run check:links
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Upload to S3
        env:
          BUCKET: ${{ vars.SITE_BUCKET }}
        run: |
          # Fingerprinted assets never change, so cache them for a year. Old ones are kept
          # (they're excluded from --delete) so open tabs don't break mid-deploy.
          aws s3 sync site/dist/_astro "s3://$BUCKET/_astro" --cache-control "public,max-age=31536000,immutable"
          # Pages and the search index must update promptly.
          aws s3 sync site/dist "s3://$BUCKET" --delete --exclude "_astro/*" --cache-control "public,max-age=300,must-revalidate"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.DISTRIBUTION_ID }}" --paths "/*"
