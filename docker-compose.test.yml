# Isolated test stack:
#   docker compose -p aws-visual-lab-project-test -f docker-compose.yml -f docker-compose.test.yml up -d --build
# Renames the container, publishes the UI on localhost only (TEST_UI_PORT in .env; empty = a free port) and
# keeps it off tunnel-net, so it never clashes with the app that is live in the tunnel.
services:
  frontend:
    container_name: aws-lab-test-frontend
    ports: !override
      - "127.0.0.1:${TEST_UI_PORT:-}:80"
    restart: "no"
    networks: !override
      - default
