server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    # Browser-only lab: there is no API and nothing accepts uploads
    client_max_body_size 16k;

    # Hashed build assets never change, so let browsers cache them
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The page itself must revalidate so a deploy shows up straight away
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hash routing: everything else falls back to the app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
